name: 规则补充或纠错
description: 提交新的正式来源、规则遗漏、错误结果或反例
title: "[规则] "
labels: ["rule", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 请勿提交身份证号、未公开申请书或真实敏感项目数据。请使用匿名化示例。
  - type: input
    id: authority
    attributes:
      label: 主管部门与年度
      placeholder: 例如：国家自然科学基金委员会，2026
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 官方来源 URL
      description: 请优先提供主管部门官方网站链接。
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 文件位置
      placeholder: 文件名、第 7 页、二（二）1
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: 规则理解
      description: 请说明适用条件、例外和可能的歧义。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 匿名化最小示例
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 当前结果与预期结果
    validations:
      required: true
